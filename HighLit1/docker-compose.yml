version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: highlit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: highlit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - highlit-network

  redis:
    image: redis:7-alpine
    container_name: highlit-redis
    ports:
      - "6379:6379"
    networks:
      - highlit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: highlit-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: highlit
      CHANNEL_LAYER_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3001
    depends_on:
      - postgres
      - redis
    networks:
      - highlit-network
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: highlit-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SOCKET_URL: ws://localhost:8000
    depends_on:
      - backend
    networks:
      - highlit-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  highlit-network:
    driver: bridge

volumes:
  postgres_data:

