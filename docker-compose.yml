version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: highlit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: highlit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - highlit-network

  redis:
    image: redis:7-alpine
    container_name: highlit-redis
    ports:
      - "6379:6379"
    networks:
      - highlit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: highlit-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: highlit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3001
    depends_on:
      - postgres
      - redis
    networks:
      - highlit-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: highlit-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - highlit-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

networks:
  highlit-network:
    driver: bridge

volumes:
  postgres_data:

